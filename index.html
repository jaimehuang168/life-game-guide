<style>
:root{--paper:#ECF1EC;--card:#F8FBF8;--ink:#1B2522;--muted:#5A6964;--line:#C9D5CE;--jade:#2D6A4C;--flame:#BF3F2A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#101715;--card:#17201D;--ink:#E3EBE6;--muted:#93A39C;--line:#2B3833;--jade:#6DB38D;--flame:#EE6B4F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
img{width:64px;height:64px;border-radius:14px}
h1{margin:0;font-size:22px;font-family:"Noto Serif TC","Songti TC",serif}
p{margin:0;color:var(--muted);font-size:13px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input[type=password]{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.row{flex-direction:row;align-items:center;gap:8px}
button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--jade);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--flame);min-height:1.2em}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>btoa(String.fromCharCode(...u));
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(P.salt),iterations:P.iter},base,256));
}
async function unlock(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem("lg-key")}catch(e){}
  if(saved){try{const k=JSON.parse(saved);if(k.salt===P.salt){await unlock(b64(k.raw));return}}catch(e){}
    try{localStorage.removeItem("lg-key")}catch(e){}}
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="解鎖中…";err.textContent="";
  try{
    const raw=await derive(document.getElementById("pw").value);
    if(document.getElementById("remember").checked){try{localStorage.setItem("lg-key",JSON.stringify({salt:P.salt,raw:tob64(raw)}))}catch(e){}}
    await unlock(raw);
  }catch(x){
    try{localStorage.removeItem("lg-key")}catch(e){}
    err.textContent="密碼不對，請再試一次。";btn.disabled=false;btn.textContent="解鎖";
  }
});
</script>
